<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>micro-llm hotspot — sample ring</title>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="chrome" aria-hidden="false">
        <div id="hud-tl">
          <div class="badge">SAMPLE</div>
          <div class="k">HTR1 · 64-layer 3+1 · no live attach</div>
        </div>
        <div id="hud-tr">
          <div class="count">
            <span class="k">tokens</span>
            <span class="v pulse" id="tokens">0</span>
            <span class="k" id="tps-wrap"><span id="tps">—</span> tok/s</span>
          </div>
          <div class="meta">
            <span id="layer">—</span>
            <span id="tps"></span>
            <span id="flags"></span>
          </div>
        </div>
        <footer id="budget">
          <div class="cap">
            <span>15.2 labeled example</span>
            <span id="budget-nums">—</span>
          </div>
          <div class="track"><div id="budget-fill" class="fill green"></div></div>
          <div class="parts" id="budget-parts"></div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
